name: CI

# Error check on every push to any branch and on pull requests: code
# generation, analyze, format, and tests. Pushes to main also build the prod
# App Bundle.
on:
  pull_request:
  push:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Code generation
        run: dart run build_runner build --delete-conflicting-outputs

      # The committed icons and splash must match assets/branding/ (feature
      # 012 research R6).
      - name: Branding is up to date
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
          if ! git diff --exit-code -- android/app/src/main/res ios/Runner/Assets.xcassets; then
            echo "::error::Run flutter_launcher_icons and flutter_native_splash:create and commit the result"
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      - name: Format check
        run: dart format --set-exit-if-changed .

      # Linux is the golden reference platform (research R11). No baselines
      # are committed yet, so goldens are skipped; drop --exclude-tags once
      # `flutter test --tags golden --update-goldens` output is committed.
      - name: Tests
        run: flutter test --coverage --exclude-tags golden

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/**/failures/
          if-no-files-found: ignore

      # Release signing uses the debug key until T5.2 (plan Open item 5).
      - name: Build prod App Bundle
        if: github.ref == 'refs/heads/main'
        run: flutter build appbundle --flavor prod --release

      - name: Upload App Bundle
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: prod-release-aab
          path: build/app/outputs/bundle/prodRelease/*.aab
