name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Format check
        run: dart format --set-exit-if-changed .

      # Linux is the golden reference platform (research R11), so all tags run here.
      - name: Tests
        run: flutter test --coverage

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/**/failures/
          if-no-files-found: ignore

      # Release signing uses the debug key until T5.2 (plan Open item 5).
      - name: Build prod App Bundle
        run: flutter build appbundle --flavor prod --release

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: prod-release-aab
          path: build/app/outputs/bundle/prodRelease/*.aab
