name: dailytrack
description: "Expense and habit tracker"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  archive: 4.5.2
  clock: ^1.1.3
  cryptography: ^2.9.0
  csv: 8.0.0
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  extension_google_sign_in_as_googleapis_auth: 3.0.0
  file_picker: 13.1.0
  firebase_analytics: ^13.0.1
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.0.2
  google_mobile_ads: 9.2.0
  google_sign_in: 7.2.0
  googleapis: 17.0.0
  home_widget: 0.10.0
  image_picker: ^1.2.4
  in_app_purchase: 3.3.1
  in_app_purchase_android: 0.5.5
  in_app_review: ^2.0.12
  intl: ^0.20.3
  json_annotation: ^4.12.0
  local_auth: ^3.0.2
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  pdf: 3.13.1
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.1
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  webview_flutter: ^4.14.1
  workmanager: ^0.10.10

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  # Performance pass driver for `flutter drive` (feature 012 research R10).
  # SDK package, test-only.
  flutter_driver:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0
  webview_flutter_platform_interface: ^2.15.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/branding/

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-SemiBold.ttf
          weight: 600
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansDevanagari-SemiBold.ttf
          weight: 600
    - family: NotoSansGujarati
      fonts:
        - asset: assets/fonts/NotoSansGujarati-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansGujarati-SemiBold.ttf
          weight: 600

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#191C1B"
  image: assets/branding/logo.png
  android_12:
    image: assets/branding/splash_android12.png
    icon_background_color: "#014D42"
    icon_background_color_dark: "#014D42"
    color: "#FFFFFF"
    color_dark: "#191C1B"
  ios: false
  web: false

flutter_launcher_icons:
  image_path: assets/branding/app_icon.png
  android: ic_launcher
  min_sdk_android: 21
  adaptive_icon_background: assets/branding/icon_background.png
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  adaptive_icon_monochrome: assets/branding/icon_monochrome.png
  ios: true
  remove_alpha_ios: true
